# CINV-CONFIG-NGINX-0001
worker_processes auto;
events { worker_connections 1024; }

http {
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3; # CINV-CONFIG-NGINX-0001
  ssl_prefer_server_ciphers off;
  ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256'; # CINV-CONFIG-NGINX-0002
  ssl_ecdh_curve X25519:prime256v1; # CINV-CONFIG-NGINX-0003

  server {
    listen 443 ssl http2;
    server_name benchmark.local;
    ssl_certificate ../../crypto-artifacts/certs/benchmark-leaf-rsa.crt; # CINV-CONFIG-NGINX-0004
    ssl_certificate_key ../../crypto-artifacts/keys/benchmark-leaf-rsa.key; # CINV-CONFIG-NGINX-0005
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { return 200 "modern tls benchmark\n"; }
  }
}
