# CINV-CONFIG-NGINX-LEGACY-0001
worker_processes 1;
events { worker_connections 128; }

http {
  server {
    listen 443 ssl;
    server_name legacy.local;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # CINV-CONFIG-NGINX-LEGACY-0001
    ssl_ciphers 'DES-CBC3-SHA:AES128-SHA:RC4-SHA'; # CINV-CONFIG-NGINX-LEGACY-0002
    ssl_prefer_server_ciphers on;
    ssl_certificate ../../crypto-artifacts/certs/benchmark-legacy-sha1.crt; # CINV-CONFIG-NGINX-LEGACY-0003
    ssl_certificate_key ../../crypto-artifacts/keys/benchmark-legacy.key; # CINV-CONFIG-NGINX-LEGACY-0004
    location /legacy { return 200 "legacy tls benchmark\n"; }
  }
}
