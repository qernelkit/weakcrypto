# CINV-CONFIG-NGINX-MTLS-0001
worker_processes auto;
events { worker_connections 512; }

http {
  upstream app_backend {
    server 127.0.0.1:8080;
  }

  server {
    listen 8443 ssl;
    server_name mtls.benchmark.local;

    ssl_protocols TLSv1.2 TLSv1.3; # CINV-CONFIG-NGINX-MTLS-0001
    ssl_certificate ../../crypto-artifacts/certs/benchmark-leaf-rsa.crt; # CINV-CONFIG-NGINX-MTLS-0002
    ssl_certificate_key ../../crypto-artifacts/keys/benchmark-leaf-rsa.key; # CINV-CONFIG-NGINX-MTLS-0003
    ssl_client_certificate ../../crypto-artifacts/certs/benchmark-ca.crt; # CINV-CONFIG-NGINX-MTLS-0004
    ssl_verify_client on; # CINV-CONFIG-NGINX-MTLS-0005
    ssl_verify_depth 2;
    proxy_ssl_trusted_certificate ../../crypto-artifacts/certs/benchmark-ca.crt; # CINV-CONFIG-NGINX-MTLS-0006
    proxy_ssl_verify on; # CINV-CONFIG-NGINX-MTLS-0007

    location / {
      proxy_pass https://app_backend;
    }
  }
}
