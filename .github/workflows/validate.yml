# Every pull request: the files it adds or changes are checked before a person
# merges it. Adding repos/<owner>/<repo>/repo.json queues that repository;
# adding a CBOM beside it enters it.
name: validate

# On every pull request, whatever it touches: the check is required to merge,
# and a required check that never runs would leave a pull request stuck.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile || bun install
      - run: bunx tsc --noEmit -p .

      - name: Files this pull request adds or changes
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha }}
          git diff --name-only --diff-filter=AM "$base" HEAD -- repos seed benchmark/keys | grep -E '\.jsonl?$' > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          # The queue and the CBOMs are added to, never rewritten.
          if git diff --name-only --diff-filter=DMR "$base" HEAD -- repos | grep -q .; then
            echo "::error::repos/ is append-only: add a new file instead of changing or removing one"; exit 1
          fi

      # Every entry (a repo.json, or a line of seed/) follows schema/entry.schema.json;
      # a CBOM is valid CycloneDX 1.6 in the profile, filed under its own unused id,
      # and every line it cites exists.
      - name: Valid files
        if: steps.changed.outputs.count != '0'
        run: xargs -a changed.txt bun check.ts

      # Everything is tied to a GitHub account: the account a CBOM or a
      # repo.json names is the author of the commit that adds it.
      - name: Files are committed by the account they name
        if: steps.changed.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=${{ github.event.pull_request.base.sha }}
          for f in $(git diff --name-only --diff-filter=A "$base" HEAD -- repos | grep '\.json$'); do
            sha=$(git log --diff-filter=A --format=%H -1 -- "$f")
            author=$(gh api "repos/${{ github.repository }}/commits/$sha" --jq '.author.login // empty')
            case "$f" in
              */repo.json) named=$(jq -r .addedBy "$f") ;;
              *) named=$(jq -r '.metadata.properties[] | select(.name == "weakcrypto:submitter") | .value' "$f") ;;
            esac
            [ -n "$author" ] || { echo "::error file=$f::the commit that adds it has no GitHub account as its author"; exit 1; }
            [ "$(echo "$named" | tr A-Z a-z)" = "$(echo "$author" | tr A-Z a-z)" ] || { echo "::error file=$f::it names $named, but $author committed it"; exit 1; }
          done
          # The same for the list: every entry a pull request adds to seed/ names the account that opened it.
          opener=$(echo "${{ github.event.pull_request.user.login }}" | tr A-Z a-z)
          others=$(git diff -U0 "$base" HEAD -- seed | grep '^+{' | cut -c2- | jq -r .addedBy | tr A-Z a-z | sort -u | grep -vx "$opener" || true)
          [ -z "$others" ] || { echo "::error::seed/ entries added here name $(echo $others), but $opener opened this pull request"; exit 1; }

      - name: Queued repositories are public and not too big
        if: steps.changed.outputs.count != '0'
        run: |
          for f in $(grep '/repo\.json$' changed.txt); do
            url=$(jq -r .url "$f")
            git ls-remote --exit-code "$url" HEAD > /dev/null || { echo "::error file=$f::$url is not a public repository"; exit 1; }
            # The size limit keeps what cannot be scanned out of the queue. A repository that arrives with its
            # CBOM has been scanned already, so the limit has nothing left to say about it.
            if grep -q "^$(dirname "$f")/.*\.cbom\.json$" changed.txt; then continue; fi
            # -L: a repository that was renamed or moved answers with a redirect to where it is now.
            size=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/$(jq -r .repo "$f")" | jq -r '.size // empty')
            [ -n "$size" ] || { echo "::error file=$f::GitHub did not give a size for $(jq -r .repo "$f")"; exit 1; }
            [ "$size" -le 2000000 ] || { echo "::error file=$f::over 2 GB: too big to scan"; exit 1; }
          done
